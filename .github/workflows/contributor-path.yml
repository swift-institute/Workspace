# The contributor-path acceptance (issues #11 and #61): a clean clone with NO
# credentials follows the README quickstart — one self-hosting `swift run`
# installs the coordinator, then every command uses the installed surface —
# and reaches the expected result.
# Until this job is green the contributor path is a claim, not a property.
name: contributor-path

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contributor-path:
    name: clean clone → install → sync → context → doctor, no credentials
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # persist-credentials: false removes the checkout token from git
      # config, so every clone `sync` performs below proves public,
      # credential-free resolution — the property under test.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `Institute.json` declares the toolchain *floor* — Swift 6.3.3 and
      # Xcode 26.6 — and the README documents that same floor. The image
      # defaults to a different Xcode, so select it the way a contributor
      # would. This job deliberately runs the floor rather than the newest
      # Xcode available: the floor is what the README tells a contributor
      # to install, so it is the version that has to be proven.
      - name: Select the documented minimum Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # The command directory is exported before the bootstrap because the
      # installer refuses to publish a command the invoking shell cannot find.
      # GITHUB_PATH gives later steps the environment-manager equivalent of
      # that README export; Workspace never edits a shell startup file.
      - name: Quickstart — install the canonical command
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v institute; then
            echo "::error::clean runner unexpectedly already exposes an institute command"
            exit 1
          fi
          swift run --package-path Application institute install
          test "$(command -v institute)" = "$HOME/.local/bin/institute"
          test "$(readlink "$HOME/.local/bin/institute")" = \
            "../share/swift-institute/institute/bin/institute"
          institute --help >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quickstart — plan, then sync
        run: |
          institute sync --dry-run
          institute sync

      # The negative control for the step below, and the acceptance for the
      # defect it fixes: with no skill root cloned there is nothing to
      # project, and `context install` used to print "installed and
      # verified" and exit 0 having written nothing. A vacuous success is
      # indistinguishable from a real one, so the only way to prove this
      # stays fixed is to assert the failure.
      - name: Context — installing with no skill root must fail, not report success
        run: |
          if institute context install; then
            echo "::error::context install reported success with no canonical skill root"
            exit 1
          fi

      # The canonical roots resolve from the checkout's grandparent, which
      # is $GITHUB_WORKSPACE/../.. on a runner. This is the same placement
      # the README documents for a contributor.
      - name: Clone the public skill root, as the README documents
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/../../swift-institute"
          git clone --depth 1 https://github.com/swift-institute/Skills.git \
            "${GITHUB_WORKSPACE}/../../swift-institute/Skills"

      - name: Context — install, then verify
        run: |
          institute context install
          institute context check

      # Context is intentionally verified before doctor. These are independent
      # acceptance paths, and a doctor finding must not skip the clean-clone
      # coverage that guards against a vacuous context success.
      #
      # A healthy contributor checkout exits 0: institute-internal checks
      # report "not run", never failure; every measured check states its
      # population.
      - name: Facts — doctor
        run: institute doctor
