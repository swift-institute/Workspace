# F2 hosted Linux control (Goal swift-institute/.github#358, R38 step 1;
# swift-institute/.github#365, Workspace#136). Candidate-ref canary:
# builds the Application package on ubuntu with the released 6.3.3
# toolchain at the exact R1 head (this branch = 49fad76b + this file).
# Not a fleet workflow; deleted with the branch after evidence capture.
name: linux-control

on:
  push:
    branches:
      - f2-linux-control

permissions:
  contents: read

concurrency:
  group: linux-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.3.3-bookworm
    timeout-minutes: 180
    steps:
      - name: System provisioning (uuid-dev, typed F10 bootstrap input)
        run: apt-get update -qq && apt-get install -y -qq uuid-dev
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain identity
        run: swift --version
      - name: Build Application (release toolchain control)
        working-directory: Application
        run: swift build
